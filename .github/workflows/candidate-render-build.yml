name: Candidate Render build

on:
  pull_request:
    branches: [main]
  workflow_dispatch:

jobs:
  render-build:
    name: Wrapper deployment guard
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: Checkout wrapper only
        uses: actions/checkout@v4
        with:
          submodules: false
          fetch-depth: 0

      - name: Use Node 20
        uses: actions/setup-node@v4
        with:
          node-version: '20'

      - name: Verify guarded bot revision
        run: |
          ACTUAL="$(git ls-tree HEAD bot | awk '{print $3}')"
          EXPECTED="e743d23f046fa4e3862b3e0d5fa8d8c76c12a5c9"
          echo "bot submodule: $ACTUAL"
          test "$ACTUAL" = "$EXPECTED"

      - name: Validate wrapper package and build guards
        run: |
          node -e "const p=require('./package.json'); if(!p.scripts?.preinstall || !p.scripts?.postinstall || !p.scripts?.start) process.exit(1); console.log('wrapper scripts OK')"
          node --check ensure-bot-submodule.js
          node --check verify-build-dependency-order.js
          node --check fix-session-prep-guard.js
          node --check defer-runtime-verifier-fix.js
          node --check global-footer-patch.js
          node --check session-isolation-prep.js
          node --check session-isolation-patch.js
          node --check session-isolation-finalize.js
          node --check kickall-policy-patch.js
          node --check response-style-patch.js
          node --check verify-connected-owner-command-path.js

      - name: Confirm runtime-safe deployment policy
        run: |
          grep -q "install-hot-command-updater.js" package.json
          grep -q "install-hot-oidc-auth.js" package.json
          grep -q "test:hot-updater" package.json
          grep -q "KICKALL CONFIRMED REMOVALS" kickall-policy-patch.js
          grep -q "LATE CONNECTED OWNER AUDIT" response-style-patch.js
          grep -q "NO SILENT noReply" verify-connected-owner-command-path.js
          grep -q "process.exit(0)" verify-connected-owner-command-path.js
          echo "Runtime guards, confirmed kickall results, paired-owner routing and final anti-silence audit are wired into the deployment wrapper."
