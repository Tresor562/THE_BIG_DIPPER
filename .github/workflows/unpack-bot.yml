name: Expand audited bot payload

on:
  push:
    branches: [main]

permissions:
  contents: write

jobs:
  expand:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Expand bot payload when upload is complete
        shell: bash
        run: |
          set -euo pipefail
          if [ ! -f payload.complete ]; then
            echo "Payload upload not complete yet."
            exit 0
          fi

          cat payload.part*.b64 | base64 -d > bot_payload.tar.gz
          tmpdir="$(mktemp -d)"
          tar -xzf bot_payload.tar.gz -C "$tmpdir"

          find . -mindepth 1 -maxdepth 1 ! -name .git -exec rm -rf {} +
          cp -a "$tmpdir"/. .

          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          if git diff --cached --quiet; then
            echo "Nothing to commit."
            exit 0
          fi
          git commit -m "Deploy audited THE BIG DIPPER bot"
          git push origin main
